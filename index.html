<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Minha Lista de Tarefas</title>
<style>
  body { font-family: Arial; background: #111; color: white; text-align: center; padding: 30px; }
  input { padding: 10px; width: 250px; border-radius: 5px; border: none; }
  button { padding: 10px 15px; border-radius: 5px; border: none; background: #2ecc71; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { background: #222; margin: 10px auto; padding: 10px; width: 300px; border-radius: 5px; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<h1>Minha Lista de Tarefas</h1>
<p>Projeto feito por Ezequiel - Desenvolvedor Júnior</p>

<input type="text" id="tarefa" placeholder="Digite sua tarefa...">
<button onclick="adicionar()">Adicionar</button>

<ul id="lista"></ul>

<script>
  function adicionar() {
    let input = document.getElementById("tarefa");
    let lista = document.getElementById("lista");

    if (input.value === "") {
      alert("Digite uma tarefa!");
      return;
    }

    let li = document.createElement("li");
    li.innerHTML = input.value + ' <span onclick="this.parentElement.remove()" style="cursor:pointer">❌</span>';
    lista.appendChild(li);
    input.value = "";
  }
</script>

</body>
</html>
